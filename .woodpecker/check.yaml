clone:
  git:
    image: docker.io/woodpeckerci/plugin-git:2.9.2
    settings:
      partial: false
when:
  - event: pull_request
  - event: push
    branch: main
steps:
  - name: check
    image: ghcr.io/tta-lab/dagger-cli:0.21.7
    # Operator-provided read-only fb access; PR availability needs explicit review.
    environment:
      FB_READ_TOKEN:
        from_secret: fb-read-token
    commands:
      - dagger call -m dagger check --source=. --fb-token=env:FB_READ_TOKEN
