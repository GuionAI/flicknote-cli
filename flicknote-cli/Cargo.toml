[package]
name = "flicknote-cli"
version.workspace = true
edition = "2024"
description = "Local-first note management CLI with cloud sync"
homepage = "https://github.com/guionai/flicknote-cli"
repository = "https://github.com/guionai/flicknote-cli"
license = "MIT"

[[bin]]
name = "flicknote"
path = "src/main.rs"

[[bin]]
name = "flicknote-sync"
path = "src/bin/flicknote-sync.rs"

[package.metadata.dist]
formula = "flicknote"

[dependencies]
flicknote-core = { path = "../flicknote-core", default-features = false }
flicknote-auth = { path = "../flicknote-auth" }
flicknote-sync = { path = "../flicknote-sync" }
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
url = "2"
serde_json = { workspace = true }
tokio = { workspace = true }
libc = "0.2"
dirs = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "charset", "http2", "rustls-tls"] }
futures-util = "0.3"
serde = { workspace = true }
open = "5"
tempfile = "3"
env_logger = "0.11"
log = "0.4"
rmcp = { version = "3.1.0", default-features = false, features = ["server", "transport-io", "local", "macros"] }
schemars = "1"
httpdate = "1.0.3"

[dev-dependencies]
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
uuid = { workspace = true }

[lints]
workspace = true
