[package]
name = "flicknote-gpui"
version.workspace = true
edition = "2024"
license = "MIT"
publish = false

[package.metadata.dist]
dist = false

[target.'cfg(target_os = "macos")'.dependencies]
gpui-kit = "=0.7.0"
env_logger = "0.11"
flicknote-sync = { path = "../flicknote-sync", features = ["experimental-spike"] }
flicknote-client = { path = "../flicknote-client" }
flicknote-core = { path = "../flicknote-core" }
flicknote-auth = { path = "../flicknote-auth" }
clap = { version = "4", features = ["derive"] }
futures-lite = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
anyhow = "1"
log = "0.4"
security-framework = "=3.7.0"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
chrono = "0.4.44"

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-kit = { version = "=0.7.0", features = ["test-support"] }
tempfile = "3"
serde_json = { workspace = true }
axum = "0.8"
