[package]
name = "flicknote-sync"
version.workspace = true
edition = "2024"
description = "Background sync daemon for FlickNote CLI"
homepage = "https://github.com/guionai/flicknote-cli"
repository = "https://github.com/guionai/flicknote-cli"
license = "MIT"

[package.metadata.dist]
dist = false

[dependencies]
flicknote-core = { path = "../flicknote-core", features = ["storage-pgwire"] }
flicknote-auth = { path = "../flicknote-auth" }
powersync = { workspace = true }
rusqlite = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "signal", "sync", "io-util", "time"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "charset", "http2", "rustls", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
futures-lite = { workspace = true }
log = "0.4"
libc = "0.2.182"
notify = "8"
uuid = { workspace = true }
chrono = "0.4"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
