[package]
name = "flicknote-sync"
version.workspace = true
edition = "2024"
description = "Daemon application host for FlickNote CLI"
homepage = "https://github.com/guionai/flicknote-cli"
repository = "https://github.com/guionai/flicknote-cli"
license = "MIT"

[package.metadata.dist]
dist = false

[dependencies]
flicknote-client = { path = "../flicknote-client" }
flicknote-core = { path = "../flicknote-core" }
flicknote-auth = { path = "../flicknote-auth" }
powersync = { workspace = true }
rusqlite = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "signal", "sync", "io-util", "time", "fs", "process"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "charset", "http2", "rustls", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
futures-lite = { workspace = true }
log = "0.4"
uuid = { workspace = true }
chrono = "0.4"
fs4 = { workspace = true }
thiserror = { workspace = true }
libc = "0.2"
rmcp = { version = "=3.2.0", default-features = false, features = ["server", "transport-streamable-http-server", "macros"] }
axum = "0.8"
open = "5"
schemars = "1"
tokio-postgres = { version = "=0.7.18", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = "0.14"
tower-service = "0.3"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
bytes = "1"
