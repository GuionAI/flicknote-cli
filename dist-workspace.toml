[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "GuionAI/homebrew-tap"
# Only the unified flicknote executable is distributed.
packages = ["flicknote-cli"]
# Whether to install an updater program
install-updater = false
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-musl"]
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Which actions to run on pull requests
pr-run-mode = "skip"
# Supported reusable hook; the generator orders it before plan and requires success.
plan-jobs = ["./checks"]
# The version-bound generator below owns the additional publication dependencies.
# Regenerate with python3 scripts/generate-release-workflow.py, not plain dist init.
allow-dirty = ["ci"]

[dist.dependencies.apt]
libclang-dev = "*"
musl-tools = "*"
