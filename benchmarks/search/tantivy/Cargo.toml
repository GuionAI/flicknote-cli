[package]
name = "flicknote-search-tantivy-bench"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = { version = "0.26.2", default-features = false, features = ["mmap", "lz4-compression"] }
tempfile = "3"
