[package]
name = "flicknote-search-tantivy-bench"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
flicknote-tantivy = { path = "../../../flicknote-tantivy" }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Upstream #3034 fixes RUSTSEC-2026-0253 by upgrading lru to 0.18.2.
# Pin until a published Tantivy release includes the fix.
tantivy = { git = "https://github.com/quickwit-oss/tantivy", rev = "5ca39332002c2c87fb5d2abc707cf527b3319d42", default-features = false, features = ["mmap", "lz4-compression"] }
tempfile = "3"
