pre-commit:
  parallel: true
  commands:
    cargo-fmt:
      run: cargo fmt --all --check

pre-push:
  parallel: true
  commands:
    cargo-check:
      run: cargo check --workspace --all-targets --all-features
    cargo-clippy:
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    cargo-deny:
      run: cargo deny check
