[graph]
targets = []
all-features = false

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
]
# Rechecked for the experimental independent real-account GPUI trial (#3279).
# Exact unchanged versions/attribution: docs/embedded-gpui-spike.md and
# docs/real-account-gpui-trial.md; no installed production takeover approval.
exceptions = [
    { name = "enum-iterator", version = "=2.3.0", allow = ["0BSD"] },
    { name = "enum-iterator-derive", version = "=1.5.0", allow = ["0BSD"] },
    { name = "libbz2-rs-sys", version = "=0.2.5", allow = ["bzip2-1.0.6"] },
]
# Workspace crates are private/unlicensed
[[licenses.clarify]]
crate = "flicknote-cli"
expression = "MIT"
license-files = []
[[licenses.clarify]]
crate = "flicknote-core"
expression = "MIT"
license-files = []
[[licenses.clarify]]
crate = "flicknote-auth"
expression = "MIT"
license-files = []
[[licenses.clarify]]
crate = "flicknote-sync"
expression = "MIT"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/GuionAI/powersync-native"]

[advisories]
# User-approved informational unmaintained notices for the pinned trial GUI.
# Experimental real-account scope rechecked; no vulnerability/unsoundness waiver.
# Paths, pinned versions and headless non-reachability are recorded in the guide.
ignore = [
    "RUSTSEC-2024-0384", # instant 0.1.13: gpui-kit -> gpui-base; no fixed upgrade.
    "RUSTSEC-2024-0436", # paste 1.0.15: gpui-kit -> gpui-component macros.
    "RUSTSEC-2025-0134", # rustls-pemfile 2.2.0: assets -> gpui-pre-reqwest; non-Mac.
    "RUSTSEC-2026-0206", # rustybuzz 0.20.1: gpui-pre -> usvg text shaping.
    "RUSTSEC-2026-0192", # ttf-parser 0.25.1: gpui-pre font parsing.
]
