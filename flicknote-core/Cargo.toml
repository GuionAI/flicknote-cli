[package]
name = "flicknote-core"
version.workspace = true
edition = "2024"

[features]
default = ["powersync"]
powersync = ["dep:powersync"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
powersync = { workspace = true, optional = true }
rusqlite = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
flicknote-auth = { path = "../flicknote-auth" }
dirs = { workspace = true }
chrono = "0.4"
uuid = { workspace = true }
pulldown-cmark = { version = "0.13.1", default-features = false }
sha2 = "0.10"
yaml_serde = "0.10"
log = "0.4"
schemars = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
